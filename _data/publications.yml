    link: https://doi.org/10.48550/arXiv.2608.09493
    abstract: >
      Long-horizon future-frame prediction is important for autonomous driving,
      traffic surveillance, and intelligent transportation systems, yet remains
      challenging due to temporal ghosting, geometry drift, and inconsistent
      object motion. Recent latent video diffusion models have achieved
      impressive visual quality, but directly applying them to structured
      traffic scenes often leads to unstable geometry and degraded temporal
      coherence over extended horizons. We present a training-free inference
      framework that stabilizes reliable static structure in pretrained video
      predictions through multi-frame temporal context and view-conditioned
      routing. For front-camera videos, our method refines generated futures
      with a multi-frame depth-layered renderer that projects static geometry
      from observed history frames while preserving dynamic regions from the
      generative base model. For heterogeneous traffic views, a frozen
      vision-language model infers a coarse camera group from the observed clip
      and selects a specialized motion-based predictor. The framework requires
      neither retraining nor fine-tuning of the underlying video model and can
      be applied directly to pretrained generators. We validate the proposed
      framework on the AI City Challenge Track 5 benchmark, where our final
      system achieves competitive performance among the top-ranked teams. These
      results demonstrate that geometry-aware inference-time refinement and
      view-conditioned hybrid inference can improve static-geometry stability
      and low-level structural fidelity without changing the original model
      architecture.
